<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Marden Martins — Developer Portfolio</title>
  <desc id="desc">Dark graphite portfolio banner with neon lime and violet accents, abstract orbital paths and terminal-inspired details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#1C2028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B7F36B"/>
      <stop offset="100%" stop-color="#C5A3FF"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="1000" cy="170" r="205" fill="#B7F36B" opacity=".055"/>
  <circle cx="1000" cy="170" r="148" fill="none" stroke="#C5A3FF" stroke-opacity=".42" stroke-width="1.5"/>
  <circle cx="1000" cy="170" r="108" fill="none" stroke="#B7F36B" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 10"/>
  <path d="M825 265 C900 40 1090 40 1175 265" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <path d="M850 85 L1080 255 M900 45 L1145 220" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"/>
  <g fill="#B7F36B">
    <circle cx="1000" cy="22" r="5"/><circle cx="1148" cy="170" r="5"/><circle cx="852" cy="170" r="5"/>
  </g>
  <g transform="translate(78 70)">
    <rect width="104" height="28" rx="14" fill="#B7F36B" fill-opacity=".13" stroke="#B7F36B" stroke-opacity=".55"/>
    <text x="52" y="19" text-anchor="middle" fill="#B7F36B" font-family="monospace" font-size="12" letter-spacing="2">PORTFOLIO</text>
  </g>
  <text x="78" y="168" fill="#F1F2EC" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">MARDEN MARTINS</text>
  <text x="82" y="214" fill="#C5A3FF" font-family="Arial, Helvetica, sans-serif" font-size="23">Análise e Desenvolvimento de Sistemas</text>
  <text x="82" y="260" fill="#A7ADB8" font-family="monospace" font-size="15" letter-spacing="2">BUILDING • LEARNING • ITERATING</text>
  <path d="M82 285H355" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(82 305)" fill="#777F8C" font-family="monospace" font-size="10">
    <text x="0" y="0">01 / SOFTWARE DEVELOPMENT</text>
    <text x="245" y="0">02 / CONTINUOUS LEARNING</text>
  </g>
</svg>